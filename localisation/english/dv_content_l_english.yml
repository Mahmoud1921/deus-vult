l_english:
 dv_catholic:0 "Catholic"
 dv_catholic_desc:0 "The Pope in Rome is the head of the Church, and the call to crusade comes from him."
 dv_orthodox:0 "Orthodox"
 dv_orthodox_desc:0 "The Patriarch of Constantinople guides the faithful of the East."
 dv_sunni:0 "Sunni Islam"
 dv_sunni_desc:0 "The Abbasid Caliph in Baghdad is the nominal head of the faithful."
 dv_shia:0 "Shia Islam"
 dv_shia_desc:0 "The followers of Ali, a minority among the Muslims of the region."
 dv_pagan:0 "Old Gods"
 dv_pagan_desc:0 "The old gods of forest and field are still worshipped here, far from any church."
 dv_tengri:0 "Tengrism"
 dv_tengri_desc:0 "The Eternal Blue Sky rules over the riders of the steppe."
 dv_dharmic:0 "Eastern Faiths"
 dv_dharmic_desc:0 "Buddhist, Hindu and Confucian traditions shape this realm."
 dv_native:0 "Native Faiths"
 dv_native_desc:0 "Local traditions, far from the Holy Land."
 dv_crusader_vow:0 "Crusader Vow"
 dv_crusader_vow_desc:0 "Our lords have taken the cross. Their sins are forgiven if they fight for Jerusalem."
 dv_jihad:0 "Jihad"
 dv_jihad_desc:0 "Our warriors have answered the call to drive the Franks from the lands of Islam."
 dv_military_orders:0 "The Military Orders"
 dv_military_orders_desc:0 "The Templars and Hospitallers hold the castles of the kingdom and fight to the last man."
 dv_turcopoles:0 "Turcopoles"
 dv_turcopoles_desc:0 "Locally raised light horsemen who fight in the eastern style."
 dv_italian_merchants:0 "Italian Merchants"
 dv_italian_merchants_desc:0 "Genoese, Pisan and Venetian traders keep the ports of the kingdom alive."
 dv_kingdom_endures:0 "The Kingdom Endures"
 dv_kingdom_endures_desc:0 "Against every expectation, the Latin Kingdom still stands."
 dv_mamluk_regiments:0 "Mamluk Regiments"
 dv_mamluk_regiments_desc:0 "Slave-soldiers raised from boyhood to fight, loyal to the sultan alone."
 dv_egyptian_grain:0 "Egyptian Grain"
 dv_egyptian_grain_desc:0 "The Nile harvest feeds the armies of the sultan."
 dv_madrasas:0 "Madrasas and Waqf"
 dv_madrasas_desc:0 "Religious schools and endowments spread learning and loyalty."
 dv_sultan_of_egypt_and_syria:0 "Sultan of Egypt and Syria"
 dv_sultan_of_egypt_and_syria_desc:0 "Saladin rules from the Nile to the Euphrates."
 dv_same_faith:0 "Shares our faith"
 dv_schismatic:0 "Schismatic"
 dv_infidel:0 "Infidel"
 dv_holy_war:0 "Holy War"
 dv_holy_war_desc:0 "Jerusalem is under attack. The faithful on both sides are called to war."
 dv_faith:0 "Faith"
 dv_faith_desc:0 "Missionaries from Rome, Constantinople and Baghdad are at our gates."
 dv_take_the_cross:0 "Take the Cross"
 dv_take_the_cross_desc:0 "Swear the crusader vow, join the Crusader States and march against Saladin."
 dv_answer_the_jihad:0 "Answer the Jihad"
 dv_answer_the_jihad_desc:0 "Join the Ayyubid Alliance and help drive the Franks into the sea."
 dv_convert_pagan_to_catholic:0 "Convert to Catholic"
 dv_convert_pagan_to_catholic_desc:0 "Abandon the Old Gods and accept Catholic. The change will unsettle our people for a time."
 dv_convert_pagan_to_orthodox:0 "Convert to Orthodox"
 dv_convert_pagan_to_orthodox_desc:0 "Abandon the Old Gods and accept Orthodox. The change will unsettle our people for a time."
 dv_convert_pagan_to_sunni:0 "Convert to Sunni Islam"
 dv_convert_pagan_to_sunni_desc:0 "Abandon the Old Gods and accept Sunni Islam. The change will unsettle our people for a time."
 dv_convert_tengri_to_catholic:0 "Convert to Catholic"
 dv_convert_tengri_to_catholic_desc:0 "Abandon the Tengrism and accept Catholic. The change will unsettle our people for a time."
 dv_convert_tengri_to_orthodox:0 "Convert to Orthodox"
 dv_convert_tengri_to_orthodox_desc:0 "Abandon the Tengrism and accept Orthodox. The change will unsettle our people for a time."
 dv_convert_tengri_to_sunni:0 "Convert to Sunni Islam"
 dv_convert_tengri_to_sunni_desc:0 "Abandon the Tengrism and accept Sunni Islam. The change will unsettle our people for a time."
 dv_jrs_horns_of_hattin:0 "The Horns of Hattin"
 dv_jrs_horns_of_hattin_desc:0 "The army of Jerusalem has marched out to meet Saladin. Whatever happens at Hattin, the kingdom must survive it."
 dv_jrs_defend_tyre:0 "Hold Tyre"
 dv_jrs_defend_tyre_desc:0 "Conrad of Montferrat has arrived in Tyre. While Tyre holds, the kingdom lives."
 dv_jrs_military_orders:0 "The Military Orders"
 dv_jrs_military_orders_desc:0 "Give the Templars and Hospitallers command of the frontier castles."
 dv_jrs_turcopoles:0 "Raise the Turcopoles"
 dv_jrs_turcopoles_desc:0 "Recruit local horsemen who can match the Turkish horse archers."
 dv_jrs_siege_engines:0 "Engines of War"
 dv_jrs_siege_engines_desc:0 "Build the mangonels and trebuchets we need to take back our cities."
 dv_jrs_reclaim_jerusalem:0 "Reclaim Jerusalem"
 dv_jrs_reclaim_jerusalem_desc:0 "The Holy City must be Christian again, whatever the cost."
 dv_jrs_appeal_to_the_pope:0 "Appeal to the Pope"
 dv_jrs_appeal_to_the_pope_desc:0 "Send Archbishop Joscius west with the news. Christendom must answer."
 dv_jrs_the_third_crusade:0 "The Third Crusade"
 dv_jrs_the_third_crusade_desc:0 "Richard of England, Philip of France and Frederick Barbarossa take the cross. Any of them still ruled by the AI joins our faction and marches on Saladin."
 dv_jrs_peace_with_saladin:0 "Peace with Saladin"
 dv_jrs_peace_with_saladin_desc:0 "Saladin is a man of his word. Make peace while the kingdom still has something left to save."
 dv_jrs_lionheart:0 "The Lionheart Arrives"
 dv_jrs_lionheart_desc:0 "The crusaders land at Acre. With Europe at our side, the war can be won."
 dv_jrs_haute_cour:0 "Summon the High Court"
 dv_jrs_haute_cour_desc:0 "The barons of the kingdom must stop quarrelling and stand behind the king."
 dv_jrs_italian_merchants:0 "Italian Merchants"
 dv_jrs_italian_merchants_desc:0 "Grant trading quarters to the Italian republics in return for ships and silver."
 dv_jrs_castles:0 "Rebuild the Castles"
 dv_jrs_castles_desc:0 "Krak des Chevaliers, Margat and Kerak must be made ready for the next siege."
 dv_jrs_kingdom_endures:0 "The Kingdom Endures"
 dv_jrs_kingdom_endures_desc:0 "The Latin Kingdom of Jerusalem has survived its darkest hour."
 dv_ayb_unite_the_faithful:0 "Unite the Faithful"
 dv_ayb_unite_the_faithful_desc:0 "Egypt and Syria answer to one sultan for the first time in a century. Now they must fight as one."
 dv_ayb_mamluks:0 "Mamluk Regiments"
 dv_ayb_mamluks_desc:0 "Expand the corps of slave-soldiers who form the core of the sultan's army."
 dv_ayb_victory_at_hattin:0 "Victory at Hattin"
 dv_ayb_victory_at_hattin_desc:0 "The Frankish army lies broken on the Horns of Hattin. Their cities are defenceless."
 dv_ayb_take_jerusalem:0 "Take Jerusalem"
 dv_ayb_take_jerusalem_desc:0 "Al-Quds must return to Islam, as it was before the Franks came."
 dv_ayb_sweep_the_coast:0 "Sweep the Coast"
 dv_ayb_sweep_the_coast_desc:0 "Acre, Tyre, Tripoli and Antioch: take every port before help comes from the sea."
 dv_ayb_saladin_in_the_field:0 "Saladin Takes the Field"
 dv_ayb_saladin_in_the_field_desc:0 "The sultan leads the army in person."
 dv_ayb_caliphs_blessing:0 "The Caliph's Blessing"
 dv_ayb_caliphs_blessing_desc:0 "Seek the blessing of the Abbasid Caliph in Baghdad for the war against the Franks."
 dv_ayb_proclaim_jihad:0 "Proclaim the Jihad"
 dv_ayb_proclaim_jihad_desc:0 "Call every Muslim ruler to the holy war. The Artuqids and the Caliph join our alliance if the AI rules them."
 dv_ayb_treaty_of_ramla:0 "Treaty of Ramla"
 dv_ayb_treaty_of_ramla_desc:0 "Leave the Franks their coast and let the pilgrims come. The empire needs peace more than glory."
 dv_ayb_egyptian_grain:0 "Egyptian Grain"
 dv_ayb_egyptian_grain_desc:0 "Organise the Nile harvest to feed the armies in Syria."
 dv_ayb_citadel_of_cairo:0 "The Citadel of Cairo"
 dv_ayb_citadel_of_cairo_desc:0 "Build a fortress on the Muqattam hills to guard the capital."
 dv_ayb_madrasas:0 "Madrasas and Waqf"
 dv_ayb_madrasas_desc:0 "Endow schools in Cairo, Damascus and Aleppo."
 dv_ayb_sultan_of_egypt_and_syria:0 "Sultan of Egypt and Syria"
 dv_ayb_sultan_of_egypt_and_syria_desc:0 "No one in the Muslim world can now doubt who rules from the Nile to the Euphrates."
