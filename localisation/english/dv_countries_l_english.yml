 DV_BOOKMARK_1187:0 "The Third Crusade"
 DV_BOOKMARK_1187_DESC:0 "July 1187. Saladin has invaded the Kingdom of Jerusalem, and Europe is about to take the cross."
 DV_OTHER_BOOKMARK_DESC:0 "A realm caught up in the struggle for the Holy Land."
 DV_JRS_BOOKMARK_DESC:0 "4 July 1187. King Guy has marched the whole army of Jerusalem out to relieve Tiberias. Saladin waits at the Horns of Hattin."
 DV_AYB_BOOKMARK_DESC:0 "Saladin has united Egypt and Syria under one banner. Now the Franks have left their walls behind."
 DV_AGV_BOOKMARK_DESC:0 "Henry II rules from the Scottish border to the Pyrenees. The fall of Jerusalem will put the cross in his son's hands."
 DV_FRK_BOOKMARK_DESC:0 "Young Philip Augustus wants to break the Angevin hold on France, but the call to crusade may come first."
 DV_HRE_BOOKMARK_DESC:0 "Frederick Barbarossa, the old emperor, has one last campaign left in him."
 DV_BYZ_BOOKMARK_DESC:0 "Isaac II Angelos holds a weakened empire, threatened by Bulgarian rebels, Sicilian fleets and crusading armies alike."
 DV_RUM_BOOKMARK_DESC:0 "Kilij Arslan II has beaten Byzantium at Myriokephalon, but his sons are already fighting over his realm."
