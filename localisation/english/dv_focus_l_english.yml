l_english:
 dv_crusader_king:0 "Crusader King"
 dv_crusader_king_desc:0 "Our king has fought in the Holy Land, and every knight in the realm wants to follow him."
 dv_angevin_empire:0 "The Angevin Empire"
 dv_angevin_empire_desc:0 "From the Scottish border to the Pyrenees, the lands of the Plantagenets hold together."
 dv_exchequer:0 "The Exchequer"
 dv_exchequer_desc:0 "Royal clerks count the king's revenues on a chequered cloth, and nothing escapes them."
 dv_common_law:0 "The Common Law"
 dv_common_law_desc:0 "Royal justices ride out across the kingdom, and the same law holds everywhere."
 dv_baillis:0 "Baillis and Seneschals"
 dv_baillis_desc:0 "Paid royal officials, not barons, now run the king's lands."
 dv_french_chivalry:0 "Chivalry of France"
 dv_french_chivalry_desc:0 "The heavy horse of France is the finest in Christendom."
 dv_university_of_paris:0 "University of Paris"
 dv_university_of_paris_desc:0 "Masters and students from all over Christendom gather on the left bank of the Seine."
 dv_champagne_fairs:0 "Fairs of Champagne"
 dv_champagne_fairs_desc:0 "Merchants from Flanders and Italy meet at Troyes and Provins under royal protection."
 dv_rex_franciae:0 "Rex Franciae"
 dv_rex_franciae_desc:0 "No longer King of the Franks, but King of France."
 dv_teutonic_order:0 "The Teutonic Order"
 dv_teutonic_order_desc:0 "A field hospital outside Acre has become an order of German knights."
 dv_lombard_towns:0 "Lombard Towns"
 dv_lombard_towns_desc:0 "The rich cities of Lombardy pay the emperor in silver rather than blood."
 dv_ostsiedlung:0 "Ostsiedlung"
 dv_ostsiedlung_desc:0 "German settlers clear the forests and found new towns east of the Elbe."
 dv_hohenstaufen:0 "The Hohenstaufen Empire"
 dv_hohenstaufen_desc:0 "The house of Staufen rules from the North Sea to Sicily."
 dv_varangian_guard:0 "The Varangian Guard"
 dv_varangian_guard_desc:0 "Axe-bearing Englishmen and Norsemen guard the emperor's person."
 dv_venetian_quarter:0 "The Venetian Quarter"
 dv_venetian_quarter_desc:0 "Venice trades tax-free in the Golden Horn, and her galleys sail for the emperor."
 dv_pisan_quarter:0 "Pisan and Genoese Quarters"
 dv_pisan_quarter_desc:0 "Playing the Italians against each other keeps any one of them from growing too strong."
 dv_roman_restoration:0 "Roman Restoration"
 dv_roman_restoration_desc:0 "The empire of the Komnenoi rises again."
 dv_pronoia:0 "Pronoia Grants"
 dv_pronoia_desc:0 "Soldiers are granted the revenues of land in return for service."
 dv_basileia:0 "Basileia ton Rhomaion"
 dv_basileia_desc:0 "The Empire of the Romans is eternal."
 dv_norman_kingdom:0 "The Norman Kingdom"
 dv_norman_kingdom_desc:0 "The Hauteville crown stays in Sicily, whatever the Emperor says."
 dv_arab_norman:0 "The Diwan of Palermo"
 dv_arab_norman_desc:0 "Greek, Arab and Latin clerks run the richest kingdom in the West."
 dv_lombard_league:0 "The Lombard League"
 dv_lombard_league_desc:0 "The free cities of the north stand with the Pope against the Emperor."
 dv_indulgences:0 "Indulgences"
 dv_indulgences_desc:0 "Remission of sin for those who give to the crusade."
 dv_lateran_reform:0 "Lateran Reform"
 dv_lateran_reform_desc:0 "A council of the whole Church reforms the clergy and settles doctrine."
 dv_vicar_of_christ:0 "Vicar of Christ"
 dv_vicar_of_christ_desc:0 "Kings kneel before the throne of Saint Peter."
 dv_turkmen_archers:0 "Turkmen Horse Archers"
 dv_turkmen_archers_desc:0 "Nomad horsemen who strike and vanish before the knights can charge."
 dv_persian_court:0 "The Persian Court of Konya"
 dv_persian_court_desc:0 "Poets, architects and scholars from Persia fill the sultan's capital."
 dv_sultanate_of_rum:0 "Sultanate of Rum"
 dv_sultanate_of_rum_desc:0 "The Turks rule the lands of Rome in Anatolia, and mean to keep them."
 dv_mounted_warriors:0 "Mounted Warriors"
 dv_mounted_warriors_desc:0 "Our best fighters go to war on horseback."
 dv_old_ways:0 "The Old Ways"
 dv_old_ways_desc:0 "We fight for the gods of our fathers, in the forests and hills we know."
 dv_faithful_realm:0 "A Faithful Realm"
 dv_faithful_realm_desc:0 "Prince, priests and people share one faith."
 dv_friendship:0 "Friendship"
 dv_betrayal:0 "Betrayal"
 dv_agv_angevin_inheritance:0 "The Angevin Inheritance"
 dv_agv_angevin_inheritance_desc:0 "King Henry rules England, Normandy, Anjou and Aquitaine. Holding it all together is the work of a lifetime."
 dv_agv_saladin_tithe:0 "The Saladin Tithe"
 dv_agv_saladin_tithe_desc:0 "A tenth of every man's goods and income, to pay for the war in the East."
 dv_agv_take_the_cross:0 "Take the Cross"
 dv_agv_take_the_cross_desc:0 "Richard, Count of Poitou, was the first prince north of the Alps to take the cross. We join the Crusader States and go to war with Saladin. If we already swore the vow, this focus completes on its own."
 dv_agv_sail_for_outremer:0 "Sail for Outremer"
 dv_agv_sail_for_outremer_desc:0 "A great fleet gathers at Dartmouth for the long voyage to the Holy Land."
 dv_agv_lionheart:0 "The Lionheart"
 dv_agv_lionheart_desc:0 "Richard is the greatest soldier of the age, and he wants to command in person."
 dv_agv_conquest_of_cyprus:0 "The Conquest of Cyprus"
 dv_agv_conquest_of_cyprus_desc:0 "Isaac Komnenos mistreated our shipwrecked sailors. Cyprus will pay for it, and make a fine base for the crusade."
 dv_agv_siege_of_acre:0 "The Siege of Acre"
 dv_agv_siege_of_acre_desc:0 "Bring up the siege towers and the great trebuchets. Acre must fall."
 dv_agv_crusader_king:0 "Return of the Crusader King"
 dv_agv_crusader_king_desc:0 "The king comes home from the Holy Land with his fame spread across Christendom."
 dv_agv_rebellious_sons:0 "The Rebellious Sons"
 dv_agv_rebellious_sons_desc:0 "Henry's sons have risen against him before and will again. Settle the succession before France can use it."
 dv_agv_defend_normandy:0 "Defend Normandy"
 dv_agv_defend_normandy_desc:0 "The duchy is the heart of our lands across the sea, and the French king covets it."
 dv_agv_hold_the_empire:0 "Hold the Angevin Empire"
 dv_agv_hold_the_empire_desc:0 "Keep what we have. Every castle from Rouen to Bordeaux will be ready."
 dv_agv_crush_the_capetians:0 "Crush the Capetians"
 dv_agv_crush_the_capetians_desc:0 "The King of France is our vassal for Normandy, yet he plots against us. Take Picardy and the Vexin and end the threat."
 dv_agv_chateau_gaillard:0 "Chateau Gaillard"
 dv_agv_chateau_gaillard_desc:0 "Build the strongest castle in the world on the cliffs above the Seine."
 dv_agv_exchequer:0 "The Exchequer"
 dv_agv_exchequer_desc:0 "Make the royal treasury the best run in Europe."
 dv_agv_lordship_of_ireland:0 "Lordship of Ireland"
 dv_agv_lordship_of_ireland_desc:0 "Prince John is Lord of Ireland, but the Irish kings do not accept it. Finish the conquest Strongbow began."
 dv_agv_welsh_marches:0 "The Welsh Marches"
 dv_agv_welsh_marches_desc:0 "The Lord Rhys still raids the marcher lordships. Wales must be brought under the crown."
 dv_agv_treaty_of_falaise:0 "Enforce the Treaty of Falaise"
 dv_agv_treaty_of_falaise_desc:0 "William the Lion swore homage to Henry for all of Scotland. Make him keep that oath."
 dv_agv_quitclaim_of_canterbury:0 "Quitclaim of Canterbury"
 dv_agv_quitclaim_of_canterbury_desc:0 "Sell the Scots their freedom for ten thousand marks. We need the silver more than their homage."
 dv_agv_wool_trade:0 "The Wool Trade"
 dv_agv_wool_trade_desc:0 "English wool clothes half of Flanders. Tax the trade and build on it."
 dv_agv_common_law:0 "The Common Law"
 dv_agv_common_law_desc:0 "The king's justices bring one law to the whole realm."
 dv_frk_philip_augustus:0 "Philip Augustus"
 dv_frk_philip_augustus_desc:0 "The young king has a weak crown and powerful neighbours. He means to change both."
 dv_frk_take_the_cross:0 "Take the Cross"
 dv_frk_take_the_cross_desc:0 "At Gisors the kings of France and England swore to go on crusade together. We join the Crusader States and go to war with Saladin. If we already swore the vow, this focus completes on its own."
 dv_frk_genoese_fleet:0 "Hire the Genoese Fleet"
 dv_frk_genoese_fleet_desc:0 "France has no fleet of her own. Genoa will carry our army to the East, for a price."
 dv_frk_siege_of_acre:0 "The Siege of Acre"
 dv_frk_siege_of_acre_desc:0 "Our engineers will bring down the walls of Acre."
 dv_frk_return_to_france:0 "Return to France"
 dv_frk_return_to_france_desc:0 "Acre is enough. While Richard stays in the East, his lands in France lie open. Make peace with Saladin, leave the crusade and go home."
 dv_frk_stay_the_course:0 "Stay the Course"
 dv_frk_stay_the_course_desc:0 "We swore to see Jerusalem. The King of France keeps his oaths."
 dv_frk_royal_demesne:0 "Expand the Royal Demesne"
 dv_frk_royal_demesne_desc:0 "The king himself holds little more than Paris and Orleans. Every new fief must come to the crown."
 dv_frk_baillis:0 "Baillis and Seneschals"
 dv_frk_baillis_desc:0 "Send salaried royal officials to govern the king's lands in his name."
 dv_frk_young_princes:0 "Court the Young Princes"
 dv_frk_young_princes_desc:0 "Henry's sons quarrel with their father. Welcome them in Paris and turn them against him."
 dv_frk_claim_normandy:0 "Claim Normandy"
 dv_frk_claim_normandy_desc:0 "The King of England holds Normandy, Anjou and Poitou as our vassal. A vassal who defies his lord forfeits his fiefs."
 dv_frk_road_to_bouvines:0 "The Road to Bouvines"
 dv_frk_road_to_bouvines_desc:0 "Gather the knights of France for the battle that will decide the fate of the West."
 dv_frk_walls_of_paris:0 "The Walls of Paris"
 dv_frk_walls_of_paris_desc:0 "Before the king leaves for the East, his capital must have walls worthy of it."
 dv_frk_louvre:0 "The Louvre"
 dv_frk_louvre_desc:0 "A great keep on the Seine to guard the city and hold the royal treasure and arsenal."
 dv_frk_university_of_paris:0 "University of Paris"
 dv_frk_university_of_paris_desc:0 "Grant the masters and students of Paris the protection of the crown."
 dv_frk_champagne_fairs:0 "Fairs of Champagne"
 dv_frk_champagne_fairs_desc:0 "Protect the merchants on the roads to Troyes and Provins, and let the silver flow."
 dv_frk_rex_franciae:0 "Rex Franciae"
 dv_frk_rex_franciae_desc:0 "Our chancery now calls the king King of France. The realm and the crown are one."
 dv_hre_diet_of_christ:0 "The Diet of Christ"
 dv_hre_diet_of_christ_desc:0 "At Mainz the emperor has called a diet of all the princes, with Christ himself named as its president."
 dv_hre_take_the_cross:0 "Take the Cross"
 dv_hre_take_the_cross_desc:0 "Old Barbarossa takes the cross from the hands of the bishop of Wurzburg. We join the Crusader States and go to war with Saladin. If we already swore the vow, this focus completes on its own."
 dv_hre_passage_through_hungary:0 "Passage through Hungary"
 dv_hre_passage_through_hungary_desc:0 "King Bela is a friend. Ask him for passage and supplies for the army on its way east."
 dv_hre_bargain_with_isaac:0 "Bargain with Isaac Angelos"
 dv_hre_bargain_with_isaac_desc:0 "The Greek emperor does not trust us. Hostages and gold may still buy safe passage over the Hellespont."
 dv_hre_force_the_passage:0 "Force the Passage"
 dv_hre_force_the_passage_desc:0 "Isaac has made a pact with Saladin and imprisoned our envoys. Take Philippopolis and Adrianople and make him see sense."
 dv_hre_storm_of_iconium:0 "The Storm of Iconium"
 dv_hre_storm_of_iconium_desc:0 "The Seljuks of Rum harass our march at every step. Storm their capital and open the road to Syria."
 dv_hre_teutonic_order:0 "The Teutonic Order"
 dv_hre_teutonic_order_desc:0 "The German hospital at Acre becomes a military order of its own."
 dv_hre_italian_policy:0 "The Italian Policy"
 dv_hre_italian_policy_desc:0 "The emperor is King of Italy too. Lombardy, Tuscany and Rome must be brought to order."
 dv_hre_peace_of_constance:0 "Honour the Peace of Constance"
 dv_hre_peace_of_constance_desc:0 "Let the Lombard cities govern themselves, and let them pay for the privilege."
 dv_hre_pressure_the_pope:0 "Pressure the Pope"
 dv_hre_pressure_the_pope_desc:0 "The Pope crowns emperors, but he should not choose them. Bring Rome under imperial authority."
 dv_hre_sicilian_marriage:0 "The Sicilian Marriage"
 dv_hre_sicilian_marriage_desc:0 "Prince Henry has married Constance, heiress of Sicily. When King William dies, the kingdom is ours by right."
 dv_hre_crown_of_sicily:0 "The Crown of Sicily"
 dv_hre_crown_of_sicily_desc:0 "The Sicilian barons have crowned the bastard Tancred. Take what belongs to Constance."
 dv_hre_imperial_diet:0 "The Imperial Diet"
 dv_hre_imperial_diet_desc:0 "The princes of the Empire must be bound to the emperor by oath and by interest."
 dv_hre_fall_of_the_lion:0 "The Fall of Henry the Lion"
 dv_hre_fall_of_the_lion_desc:0 "Henry the Lion has been stripped of Saxony and Bavaria. Share out his lands among loyal men."
 dv_hre_ostsiedlung:0 "Ostsiedlung"
 dv_hre_ostsiedlung_desc:0 "Invite settlers from Flanders and the Rhineland to farm the lands east of the Elbe."
 dv_hre_imperial_cities:0 "Free Imperial Cities"
 dv_hre_imperial_cities_desc:0 "Grant charters to the towns. They answer to the emperor alone and pay him well."
 dv_hre_hohenstaufen:0 "The Hohenstaufen Empire"
 dv_hre_hohenstaufen_desc:0 "The house of Staufen stands above every other house in Christendom."
 dv_byz_isaac_angelos:0 "Isaac Angelos"
 dv_byz_isaac_angelos_desc:0 "The mob of Constantinople has torn Andronikos apart and made Isaac Angelos emperor. He must now rule."
 dv_byz_crusader_problem:0 "The Crusader Problem"
 dv_byz_crusader_problem_desc:0 "Another great Latin army is coming east, and its road runs through our lands."
 dv_byz_pact_with_saladin:0 "Pact with Saladin"
 dv_byz_pact_with_saladin_desc:0 "The Latins are a greater danger to us than the Sultan. Make an understanding with Saladin."
 dv_byz_aid_the_crusaders:0 "Aid the Crusaders"
 dv_byz_aid_the_crusaders_desc:0 "Open the roads and the markets to the Latin armies, and let them fight the Turks for us."
 dv_byz_recover_cyprus:0 "Recover Cyprus"
 dv_byz_recover_cyprus_desc:0 "Isaac Komnenos calls himself emperor in Cyprus. The island and its usurper must be brought back."
 dv_byz_favour_venice:0 "Favour Venice"
 dv_byz_favour_venice_desc:0 "Renew the privileges of the Venetians and let their galleys guard our seas."
 dv_byz_favour_pisa:0 "Favour Pisa and Genoa"
 dv_byz_favour_pisa_desc:0 "Venice grows too proud. Let Pisa and Genoa share the trade of the City."
 dv_byz_varangian_guard:0 "The Varangian Guard"
 dv_byz_varangian_guard_desc:0 "Recruit more Englishmen and Norsemen for the emperor's own guard."
 dv_byz_vlach_rebellion:0 "Crush the Vlach Rebellion"
 dv_byz_vlach_rebellion_desc:0 "Peter and Asen have raised the Bulgarians and Vlachs in revolt and crowned themselves. Put the rebellion down."
 dv_byz_greek_fire:0 "Greek Fire"
 dv_byz_greek_fire_desc:0 "Rebuild the imperial fleet and its secret weapon."
 dv_byz_serbia:0 "Bring Serbia to Heel"
 dv_byz_serbia_desc:0 "Stefan Nemanja has thrown off his allegiance. Remind him who his overlord is."
 dv_byz_reconquer_anatolia:0 "Reconquer Anatolia"
 dv_byz_reconquer_anatolia_desc:0 "Myriokephalon must be avenged. Phrygia and Galatia were Roman for a thousand years."
 dv_byz_restoration:0 "Komnenian Restoration"
 dv_byz_restoration_desc:0 "The army of Manuel Komnenos is reborn."
 dv_byz_pronoia:0 "Pronoia Grants"
 dv_byz_pronoia_desc:0 "Grant soldiers the revenues of land in return for service in the field."
 dv_byz_theodosian_walls:0 "The Theodosian Walls"
 dv_byz_theodosian_walls_desc:0 "No enemy has ever taken the City by storm. Repair the walls and keep it so."
 dv_byz_hagia_sophia:0 "Hagia Sophia"
 dv_byz_hagia_sophia_desc:0 "The emperor gives rich gifts to the Great Church, and the Patriarch blesses his reign."
 dv_byz_basileia:0 "Basileia ton Rhomaion"
 dv_byz_basileia_desc:0 "The Empire of the Romans has outlived every enemy. It will outlive these too."
 dv_scl_william_the_good:0 "William the Good"
 dv_scl_william_the_good_desc:0 "The young king of Sicily is rich, pious and childless. His kingdom is the envy of the Mediterranean."
 dv_scl_margaritus:0 "Margaritus of Brindisi"
 dv_scl_margaritus_desc:0 "The great admiral is ready to sail for the Levant with sixty galleys."
 dv_scl_take_the_cross:0 "Take the Cross"
 dv_scl_take_the_cross_desc:0 "King William puts on sackcloth for the loss of Jerusalem and swears to send help. We join the Crusader States and go to war with Saladin. If we already swore the vow, this focus completes on its own."
 dv_scl_relieve_tripoli:0 "Relieve Tripoli"
 dv_scl_relieve_tripoli_desc:0 "Our fleet can keep Tripoli and Tyre supplied while the kings of the North gather their armies."
 dv_scl_hauteville_succession:0 "The Hauteville Succession"
 dv_scl_hauteville_succession_desc:0 "William has no son. His aunt Constance is married to the Emperor's heir. Who will wear the crown?"
 dv_scl_crown_tancred:0 "Crown Tancred of Lecce"
 dv_scl_crown_tancred_desc:0 "Better a Norman bastard than a German emperor. The barons crown Tancred."
 dv_scl_accept_constance:0 "Accept Constance and Henry"
 dv_scl_accept_constance_desc:0 "Honour the oath sworn to Constance. Sicily becomes part of the Emperor's realm."
 dv_scl_diwan:0 "The Diwan of Palermo"
 dv_scl_diwan_desc:0 "Greek, Arab and Latin clerks keep the finest records and fullest treasury in the West."
 dv_scl_eastern_ambitions:0 "Eastern Ambitions"
 dv_scl_eastern_ambitions_desc:0 "Robert Guiscard nearly took Constantinople. The Greek empire is weak again."
 dv_scl_march_on_thessalonica:0 "March on Thessalonica"
 dv_scl_march_on_thessalonica_desc:0 "Two years ago our army sacked Thessalonica. This time we keep it."
 dv_scl_harbours_of_apulia:0 "Harbours of Apulia"
 dv_scl_harbours_of_apulia_desc:0 "Brindisi, Bari and Otranto are the gateways to the East. Enlarge them."
 dv_pps_audita_tremendi:0 "Audita Tremendi"
 dv_pps_audita_tremendi_desc:0 "On hearing with what severe and terrible judgement the land of Jerusalem has been struck... With these words the Pope calls Christendom to arms."
 dv_pps_preach_the_crusade:0 "Preach the Crusade"
 dv_pps_preach_the_crusade_desc:0 "Send legates to every Catholic court. England, France, the Empire, Sicily and Hungary join the Crusader States if the AI rules them."
 dv_pps_military_orders:0 "Bless the Military Orders"
 dv_pps_military_orders_desc:0 "Confirm the privileges of the Templars and Hospitallers, who answer only to the Pope."
 dv_pps_indulgences:0 "Indulgences"
 dv_pps_indulgences_desc:0 "Those who cannot go on crusade may still give to it, and win remission of their sins."
 dv_pps_reconcile_with_the_emperor:0 "Reconcile with the Emperor"
 dv_pps_reconcile_with_the_emperor_desc:0 "The crusade needs Barbarossa. Make peace with him and crown his son."
 dv_pps_lombard_league:0 "Back the Lombard League"
 dv_pps_lombard_league_desc:0 "The Emperor wants Sicily and Rome both. Stand with the free cities of the north against him."
 dv_pps_patrimony:0 "Patrimony of Saint Peter"
 dv_pps_patrimony_desc:0 "The lands of the Church stretch from Rome to Ravenna, whatever the Emperor's men say."
 dv_pps_lateran_council:0 "Lateran Council"
 dv_pps_lateran_council_desc:0 "Call the bishops of all Christendom to Rome to reform the Church."
 dv_pps_vicar_of_christ:0 "Vicar of Christ"
 dv_pps_vicar_of_christ_desc:0 "The Pope is no longer only the Vicar of Peter, but the Vicar of Christ, set above kings."
 dv_rum_kilij_arslan:0 "Kilij Arslan's Legacy"
 dv_rum_kilij_arslan_desc:0 "The old sultan has divided his lands among his eleven sons. The sultanate must survive his generosity."
 dv_rum_turkmen:0 "Turkmen Horse Archers"
 dv_rum_turkmen_desc:0 "Call the Turkmen tribes of the uplands to the sultan's banner."
 dv_rum_defend_iconium:0 "Defend Iconium"
 dv_rum_defend_iconium_desc:0 "Barbarossa's army is on the march. Konya must not fall."
 dv_rum_harry_the_franks:0 "Harry the Franks"
 dv_rum_harry_the_franks_desc:0 "Burn the fields, poison the wells and pick off stragglers. Let hunger and heat fight for us."
 dv_rum_reunite_the_sons:0 "Reunite the Sons"
 dv_rum_reunite_the_sons_desc:0 "One sultan, one army, one treasury."
 dv_rum_caravanserais:0 "Caravanserais"
 dv_rum_caravanserais_desc:0 "Build fortified inns a day's ride apart on the trade roads."
 dv_rum_persian_court:0 "The Persian Court"
 dv_rum_persian_court_desc:0 "Make Konya a city of poets, scholars and builders."
 dv_rum_byzantine_frontier:0 "The Byzantine Frontier"
 dv_rum_byzantine_frontier_desc:0 "The Greeks are weak and divided. The frontier can move west again."
 dv_rum_myriokephalon:0 "Spirit of Myriokephalon"
 dv_rum_myriokephalon_desc:0 "We destroyed the army of Emperor Manuel in the mountain passes. We can do it again."
 dv_rum_push_to_the_sea:0 "Push to the Sea"
 dv_rum_push_to_the_sea_desc:0 "Antalya and Smyrna would give the sultanate ports on the sea."
 dv_rum_embassy_to_saladin:0 "Embassy to Saladin"
 dv_rum_embassy_to_saladin_desc:0 "Saladin is the champion of Islam now. Make sure his armies and ours never meet."
 dv_rum_sultanate_of_rum:0 "Sultanate of Rum"
 dv_rum_sultanate_of_rum_desc:0 "The Turks of Rum are here to stay."
 dv_gen_consolidate:0 "Consolidate the Realm"
 dv_gen_consolidate_desc:0 "Bring the great lords of the realm to court and make them swear loyalty again."
 dv_gen_levies:0 "Call the Levies"
 dv_gen_levies_desc:0 "Every lord must bring his men when the ruler calls."
 dv_gen_horsemen:0 "Mounted Warriors"
 dv_gen_horsemen_desc:0 "Train our best fighters to fight from the saddle."
 dv_gen_archers:0 "Drill the Archers"
 dv_gen_archers_desc:0 "Every village must send bowmen to practise at the butts."
 dv_gen_siege_engines:0 "Siege Engines"
 dv_gen_siege_engines_desc:0 "Hire engineers who can build mangonels and trebuchets."
 dv_gen_market_charters:0 "Market Charters"
 dv_gen_market_charters_desc:0 "Grant towns the right to hold markets, and take a share of every sale."
 dv_gen_roads:0 "Mend the Roads"
 dv_gen_roads_desc:0 "Repair the old roads and bridges so that merchants and armies can move."
 dv_gen_armouries:0 "Royal Armouries"
 dv_gen_armouries_desc:0 "Bring smiths and armourers to the capital to forge weapons for the host."
 dv_gen_castles:0 "Stone Castles"
 dv_gen_castles_desc:0 "Replace the old wooden forts with walls of stone."
 dv_gen_pilgrims:0 "Pilgrims to the Holy Land"
 dv_gen_pilgrims_desc:0 "Our pilgrims bring back terrible news from Jerusalem. The Pope calls every Catholic ruler to help."
 dv_gen_take_the_cross:0 "Take the Cross"
 dv_gen_take_the_cross_desc:0 "Our lords swear the crusader vow. We join the Crusader States and go to war with Saladin. If we already swore the vow, this focus completes on its own."
 dv_gen_call_from_cairo:0 "The Call from Cairo"
 dv_gen_call_from_cairo_desc:0 "Saladin asks every Muslim ruler to help him finish the Franks."
 dv_gen_answer_the_jihad:0 "Answer the Jihad"
 dv_gen_answer_the_jihad_desc:0 "We join the Ayyubid Alliance and go to war with the Franks. If we already answered the call, this focus completes on its own."
 dv_gen_defenders_of_orthodoxy:0 "Defenders of Orthodoxy"
 dv_gen_defenders_of_orthodoxy_desc:0 "Latins to the west, Turks to the south, pagans to the north. The true faith needs defenders."
 dv_gen_envoys_to_the_patriarch:0 "Envoys to the Patriarch"
 dv_gen_envoys_to_the_patriarch_desc:0 "Send gifts to Constantinople and ask for the blessing of the Patriarch."
 dv_gen_old_ways:0 "The Old Ways"
 dv_gen_old_ways_desc:0 "We keep the faith of our ancestors, whatever the priests of distant lands say."
 dv_gen_missionaries:0 "Receive the Missionaries"
 dv_gen_missionaries_desc:0 "Hear what the missionaries from Rome, Constantinople and Baghdad have to say. Their friendship brings influence we can spend on converting, if we choose."
 dv_gen_faithful_realm:0 "A Faithful Realm"
 dv_gen_faithful_realm_desc:0 "Ruler, priests and people stand together in one faith."
