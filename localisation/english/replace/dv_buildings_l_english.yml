l_english:
 infrastructure:0 "Roads"
 infrastructure_plural:0 "Roads"
 infrastructure_desc:0 "Roads, bridges and waystations. They speed up armies, carry supply further and bring more goods to market."
 industrial_complex:0 "Market Town"
 industrial_complex_plural:0 "Market Towns"
 industrial_complex_desc:0 "Craftsmen, merchants and masons. Market towns build new castles and roads and pay for the realm."
 arms_factory:0 "Armoury"
 arms_factory_plural:0 "Armouries"
 arms_factory_desc:0 "Smiths and armourers forging swords, mail, bows and siege engines for the host."
 dockyard:0 "Shipyard"
 dockyard_plural:0 "Shipyards"
 dockyard_desc:0 "Where galleys and cogs are built."
 naval_base:0 "Harbour"
 naval_base_plural:0 "Harbours"
 naval_base_desc:0 "A sheltered port where fleets can supply, repair and carry pilgrims and trade."
 bunker:0 "Castle"
 bunker_plural:0 "Castles"
 bunker_desc:0 "Stone walls and towers. Each level gives attackers a $VALUE|+%0$ penalty in combat."
 coastal_bunker:0 "Sea Walls"
 coastal_bunker_plural:0 "Sea Walls"
 coastal_bunker_desc:0 "Walls facing the sea. Each level gives a $VALUE|+%0$ penalty to troops landing from ships."
 supply_node:0 "Waystation"
 supply_node_plural:0 "Waystations"
 supply_node_desc:0 "A stop on the road where armies can draw supply far from the capital."
 rail_way:0 "Royal Roads"
 rail_way_plural:0 "Royal Roads"
 rail_way_desc:0 "Paved roads connecting waystations so supply can reach distant armies."
